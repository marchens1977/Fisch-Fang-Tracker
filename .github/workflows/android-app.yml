# Baut die Android-App (APK) automatisch.
# - Bei jeder Änderung im Ordner "android/" (oder per Knopf "Run workflow").
# - Auf dem Hauptzweig (main) wird die APK als Download veröffentlicht:
#   https://github.com/marchens1977/Fisch-Fang-Tracker/releases/latest/download/FischfangTracker.apk
name: Android-App bauen

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../FischfangTracker.apk

      - name: APK zum Herunterladen ablegen (Artefakt)
        uses: actions/upload-artifact@v4
        with:
          name: FischfangTracker-apk
          path: FischfangTracker.apk

      - name: Als Download veröffentlichen (nur main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" FischfangTracker.apk \
            --title "Fischfang-App 1.0.${GITHUB_RUN_NUMBER}" \
            --notes "Automatisch gebaut. Auf dem Handy herunterladen und installieren." \
            --latest
